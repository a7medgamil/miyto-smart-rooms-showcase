name: Independent room-state demo

on:
  push:
    paths: ['demo/room-state-lab/**', '.github/workflows/room-state-lab.yml']
  pull_request:
    paths: ['demo/room-state-lab/**', '.github/workflows/room-state-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: demo/room-state-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
